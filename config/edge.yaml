# Edge-optimized configuration overrides

detection:
  model: "yolov8n.pt"
  batch_size: 8
  input_size: 480

vlm:
  model: "microsoft/Florence-2-base"
  batch_size: 2
  tasks:
    - "MORE_DETAILED_CAPTION"
    - "OCR_WITH_REGION"

embedding:
  model: "ViT-B-32"
  pretrained: "laion2b_s34b_b79k"
  dim: 512
  batch_size: 16

vector_db:
  quantization: "int8"

