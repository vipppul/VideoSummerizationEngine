[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-search-engine"
version = "0.1.0"
description = "End-to-End Multimodal Video Summarization and Semantic Search Pipeline"
authors = [{ name = "System Architect" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.0.0",
    "transformers>=4.40.0",
    "open-clip-torch>=2.24.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "google-generativeai>=0.8.0",
    "google-genai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

